<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="800" viewBox="0 0 760 400"
     font-family="Times New Roman, Times, serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- ── Agent ─────────────────────────────────────────── -->
  <rect x="20" y="60" width="150" height="120" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.2"/>
  <text x="95" y="84" text-anchor="middle" font-size="13" font-weight="bold">Agent (LLM)</text>
  <text x="95" y="106" text-anchor="middle" font-size="10.5">text output:</text>
  <text x="95" y="120" text-anchor="middle" font-size="10.5">completion claims</text>
  <line x1="40" y1="130" x2="150" y2="130" stroke="#999" stroke-width="0.6"/>
  <text x="95" y="146" text-anchor="middle" font-size="10.5">tool calls</text>
  <text x="95" y="160" text-anchor="middle" font-size="10.5">to the host</text>

  <!-- ── Verifier container ────────────────────────────── -->
  <rect x="196" y="20" width="324" height="228" rx="4" fill="none" stroke="#777" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="196" y="14" font-size="9.5" font-style="italic" fill="#444">verifier: zero LLM calls, every channel read-only</text>

  <rect x="212" y="38" width="292" height="40" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="1.1"/>
  <text x="358" y="55" text-anchor="middle" font-size="11.5" font-weight="bold">(1) Extract atomic claims</text>
  <text x="358" y="70" text-anchor="middle" font-size="10">natural-language output -&gt; {kind, value, span}</text>

  <rect x="212" y="90" width="292" height="40" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="1.1"/>
  <text x="358" y="107" text-anchor="middle" font-size="11.5" font-weight="bold">(2) Compile to restricted DSL</text>
  <text x="358" y="122" text-anchor="middle" font-size="10">typed AST; unknown primitive =&gt; rejected before execution</text>

  <rect x="212" y="142" width="292" height="40" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="1.1"/>
  <text x="358" y="159" text-anchor="middle" font-size="11.5" font-weight="bold">(3) Plan over 14 read-only primitives</text>
  <text x="358" y="174" text-anchor="middle" font-size="10">exists - port - file_contains - math_eq - git_head - trace_* - ...</text>

  <rect x="212" y="194" width="292" height="46" rx="3" fill="#d9d9d9" stroke="#222" stroke-width="1.3"/>
  <text x="358" y="212" text-anchor="middle" font-size="11.5" font-weight="bold">(4) Verdict</text>
  <text x="358" y="229" text-anchor="middle" font-size="10.5">supported &#183; contradicted &#183; insufficient</text>

  <!-- vertical chain -->
  <line x1="358" y1="78" x2="358" y2="88" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="358" y1="130" x2="358" y2="140" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="358" y1="182" x2="358" y2="192" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- Agent -> extract -->
  <line x1="172" y1="98" x2="209" y2="62" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- ── Ground truth ──────────────────────────────────── -->
  <rect x="566" y="60" width="176" height="78" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="654" y="80" text-anchor="middle" font-size="12" font-weight="bold">Ground truth</text>
  <text x="654" y="99" text-anchor="middle" font-size="10">OS state: files - ports</text>
  <text x="654" y="113" text-anchor="middle" font-size="10">processes - git - clock</text>
  <text x="654" y="129" text-anchor="middle" font-size="9.5" font-style="italic">read-only, no side effects</text>

  <rect x="566" y="154" width="176" height="72" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="654" y="174" text-anchor="middle" font-size="12" font-weight="bold">Trajectory</text>
  <text x="654" y="193" text-anchor="middle" font-size="10">tool results - exit codes</text>
  <text x="654" y="207" text-anchor="middle" font-size="10">arguments - timing</text>

  <!-- verifier <-> truth -->
  <line x1="506" y1="162" x2="563" y2="162" stroke="#222" stroke-width="1.1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="534" y="150" text-anchor="middle" font-size="8.5" fill="#444">query</text>
  <line x1="506" y1="196" x2="563" y2="196" stroke="#222" stroke-width="1.1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ── Consumers ─────────────────────────────────────── -->
  <line x1="358" y1="240" x2="358" y2="274" stroke="#222" stroke-width="1.1"/>
  <line x1="120" y1="274" x2="610" y2="274" stroke="#222" stroke-width="1.1"/>
  <line x1="120" y1="274" x2="120" y2="290" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="358" y1="274" x2="358" y2="290" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="610" y1="274" x2="610" y2="290" stroke="#222" stroke-width="1.1" marker-end="url(#arrow)"/>

  <rect x="20" y="292" width="200" height="80" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.1"/>
  <text x="120" y="311" text-anchor="middle" font-size="11.5" font-weight="bold">Feedback queue</text>
  <text x="120" y="330" text-anchor="middle" font-size="10">command + expected output</text>
  <text x="120" y="344" text-anchor="middle" font-size="10">(a fact the agent can re-run)</text>
  <text x="120" y="360" text-anchor="middle" font-size="9.5" font-style="italic">injected before the next turn</text>

  <rect x="258" y="292" width="200" height="80" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.1"/>
  <text x="358" y="311" text-anchor="middle" font-size="11.5" font-weight="bold">World-model ledger</text>
  <text x="358" y="330" text-anchor="middle" font-size="10">timestamp - object - TTL</text>
  <text x="358" y="344" text-anchor="middle" font-size="10">memory - calibration - escalation</text>
  <text x="358" y="360" text-anchor="middle" font-size="9.5" font-style="italic">belief kept outside the weights</text>

  <rect x="496" y="292" width="246" height="80" rx="3" fill="#f2f2f2" stroke="#222" stroke-width="1.1"/>
  <text x="619" y="311" text-anchor="middle" font-size="11.5" font-weight="bold">Signed receipts</text>
  <text x="619" y="330" text-anchor="middle" font-size="10">Ed25519 envelope - hash chain</text>
  <text x="619" y="344" text-anchor="middle" font-size="10">optional RFC 3161 anchor</text>
  <text x="619" y="360" text-anchor="middle" font-size="9.5" font-style="italic">proves who asserted; offline verifiable</text>

  <!-- feedback back to agent -->
  <line x1="70" y1="290" x2="70" y2="184" stroke="#222" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="76" y="252" font-size="9" fill="#444">dashed = next turn</text>
</svg>
